name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      # Test every version independently — don't let one failure mask the rest.
      fail-fast: false
      matrix:
        # Full battery (specs + rubocop + rbs/sord type-signature guards), from
        # the gem's floor (>= 3.3, the oldest Ruby a known client runs) up.
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Install RBS collection (stdlib sigs for sigs:validate)
      run: bundle exec rbs collection install
    - name: Run the default task
      run: bundle exec rake
    # sigs:check also fails on a sord [OMIT]/[DUCK] warning missing from (or
    # stale in) rakelib/sig_guards/sord_allowlist.txt; sigs:untyped holds sig/
    # to the committed untyped ceiling. Both only let sig/ get more typed.
    - name: Type signature guards (staleness, allowlist, grammar, untyped ceiling)
      run: bundle exec rake sigs:check sigs:validate sigs:untyped

  # FieldStruct has no ActiveSupport dependency and is not getting one. But
  # "framework independent" has to mean "behaves the same whether or not
  # ActiveSupport is loaded", and it did not: AS defines String#to_date /
  # #to_time / #to_datetime and redefines Time.===, Date#to_time and friends,
  # so a host that loads it silently changed what the gem did. On v0.9.0 the
  # unchanged suite failed 7 examples under AS — and the gem could not see it,
  # because its own suite never ran in that environment. This job is that
  # environment. Dev dependency only; the gemspec is untouched.
  activesupport:
    runs-on: ubuntu-latest
    name: ActiveSupport ${{ matrix.activesupport }} (Ruby ${{ matrix.ruby }})
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
      # Loads active_support/all before field_struct and raises on deprecations
      # (see spec/spec_helper.rb).
      FIELD_STRUCT_ACTIVESUPPORT: '1'
      # Deliberately NOT UTC. Two of the defects this lane exists to catch
      # involve the process zone, and one of them does not reproduce under
      # TZ=UTC — a UTC-only lane would hide a bug it was added to find. CI
      # runners and prod containers are UTC, which is exactly why this must
      # not be.
      TZ: America/Denver
    strategy:
      fail-fast: false
      matrix:
        # 7.2 and 8.x are not interchangeable: they differ on
        # to_time_preserves_timezone, which changes what DateTime#to_time
        # returns and how many examples fail. Both are pinned.
        include:
          # `activesupport` is the display version, `gemfile` the (snake_case)
          # file that pins it.
          - activesupport: '7.2'
            gemfile: activesupport_7_2
            ruby: '3.3'
          - activesupport: '8.1'
            gemfile: activesupport_8_1
            ruby: '3.4'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run the library specs against an ActiveSupport host
      run: bundle exec rspec

  # Report-only Steep. Steep 2.x / rbs 4.x need Ruby >= 3.3, so they live in
  # gemfiles/types.gemfile rather than the main Gemfile. This job prints the problem count and NEVER fails the build:
  # sig/ is gated by the rake guards above, not by Steep. It is deliberately
  # left out of `ci`'s needs.
  types:
    runs-on: ubuntu-latest
    name: Steep (report only)
    continue-on-error: true
    env:
      BUNDLE_GEMFILE: gemfiles/types.gemfile

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true
    - name: steep check (report only)
      run: |
        status=0
        bundle exec steep check > steep.out 2>&1 || status=$?
        cat steep.out
        summary=$(grep -E '^(Detected [0-9]+ problems|No type error detected)' steep.out || echo "steep check did not report a count (exit ${status})")
        echo "${summary}"
        echo "Steep (report only): ${summary}" >> "$GITHUB_STEP_SUMMARY"

  # One stable check name for branch protection: it passes only when every
  # job above passed, so the required check survives matrix changes.
  ci:
    runs-on: ubuntu-latest
    name: ci
    needs: [build, activesupport]
    if: always()
    steps:
    - name: Require every job to pass
      run: |
        test "${{ needs.build.result }}" = "success"
        test "${{ needs.activesupport.result }}" = "success"
