name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      # Test every version independently — don't let one failure mask the rest.
      fail-fast: false
      matrix:
        # The gem's *runtime* deps (oj, bigdecimal) support Ruby >= 3.0, which
        # is what `required_ruby_version` advertises to consumers. CI runs the
        # full battery (incl. the rbs/sord type-signature guards), and the dev
        # toolchain (`rbs`) requires Ruby >= 3.2 — so the CI floor is 3.2, not
        # 3.0. We cover that toolchain floor through the current release.
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Install RBS collection (stdlib sigs for sigs:validate)
      run: bundle exec rbs collection install
    - name: Run the default task
      run: bundle exec rake
    - name: Type signature guards (staleness + grammar)
      run: bundle exec rake sigs:check sigs:validate
